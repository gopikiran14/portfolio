<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" class="brand-logo-svg">
  <defs>
    <linearGradient id="brandLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" class="brand-stop-1" stop-color="#8b5cf6" />
      <stop offset="100%" class="brand-stop-2" stop-color="#00f2fe" />
    </linearGradient>
    <filter id="brandGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="4" y="4" width="92" height="92" rx="26" ry="26" fill="url(#brandLogoGrad)" />
  
  <!-- Subtle Specular Glass Highlight Rim -->
  <rect x="5.5" y="5.5" width="89" height="89" rx="24.5" ry="24.5" fill="none" stroke="rgba(255,255,255,0.38)" stroke-width="1.8" />

  <!-- Ultra-Precision 'GS' Monogram with Embedded Code/Architectural Synergy -->
  <g filter="url(#brandGlow)">
    <!-- Architectural 'G' -->
    <path d="M 45 33 C 41 24.5 33.5 22.5 26 22.5 C 15.5 22.5 11 31.5 11 50 C 11 68.5 15.5 77.5 26 77.5 C 36 77.5 44 70 45 52 L 28 52" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="9" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    
    <!-- Fluid Synchronous 'S' -->
    <path d="M 87 34 C 83.5 25 76.5 22.5 67 22.5 C 57 22.5 53 28.5 53 36.5 C 53 49 87 45.5 87 64 C 87 73.5 80 77.5 68 77.5 C 58 77.5 53 72.5 49 64.5" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="9" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Terminal Spark Accent -->
    <circle cx="86" cy="23" r="3.2" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>